  <circle cx="100" cy="300" r="220" fill="#55E6C1" fill-opacity="0.06"/>

  <path d="M64 209C174 207 196 170 285 174C379 178 395 225 490 215C590 204 628 111 718 124C797 135 803 187 879 177C957 167 979 72 1136 76" stroke="url(#line)" stroke-width="3" filter="url(#glow)"/>
